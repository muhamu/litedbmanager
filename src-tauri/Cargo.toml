[package]
name = "litedb-manager"
version = "0.1.0"
description = "Lightweight MySQL/MariaDB/PostgreSQL GUI client"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["mysql", "postgres", "any", "runtime-tokio", "tls-native-tls", "chrono"] }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native"] }
directories = "6"
uuid = { version = "1", features = ["v4"] }

tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

[patch.crates-io]
alloc-no-stdlib = { path = "/Users/mac/tmp/rust-alloc-no-stdlib" }
alloc-stdlib = { path = "/Users/mac/tmp/rust-alloc-no-stdlib/alloc-stdlib" }

[profile.release]
strip = true
opt-level = 2
